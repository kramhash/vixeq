[project]
name = "audio-to-sequence"
version = "0.1.0"
description = "Convert an audio file into vixeq per-band loudness sequence data"
requires-python = ">=3.13"
dependencies = [
  "librosa>=0.11",
  "numpy>=2.0",
  "soundfile>=0.13",
  "matplotlib>=3.10",
]

[project.scripts]
audio-to-sequence = "audio_to_sequence.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audio_to_sequence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
